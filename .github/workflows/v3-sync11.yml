name: Bus V3 - SYNC-11 Real Capacitor JS Native Smoke
on:
  push:
    branches:
      - feature/bus-v3-sync11-native-js-smoke
  pull_request:
    branches:
      - feature/bus-v3-sync10-disk-d-staging
permissions:
  contents: read
jobs:
  native-bridge-android36:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable Android emulator KVM
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run real JavaScript WebView to SQLCipher/Keystore bridge test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            gradle --no-daemon -p android-sync07 :storage:connectedDebugAndroidTest :testhost:connectedDebugAndroidTest
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync11-native-js-bridge-results
          path: |
            android-sync07/testhost/build/outputs/androidTest-results/
            android-sync07/testhost/build/reports/androidTests/
            android-sync07/storage/build/outputs/androidTest-results/
          if-no-files-found: ignore
