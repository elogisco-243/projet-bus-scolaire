
name: Bus V3 - PostgreSQL RLS Tests

on:
  push:
    branches:
      - feature/bus-v3-foundations
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rls-tests:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bus_v3_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bus_v3_rls_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: bus_v3_rls_test

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Base migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/001_v3_core.sql

      - name: Integrity migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/002_v3_integrity.sql

      - name: RLS migration
        run: psql -v ON_ERROR_STOP=1 -f db/migrations/003_v3_rls.sql

      - name: Integrity tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/001_v3_integrity_regression.sql

      - name: RLS security tests
        run: psql -v ON_ERROR_STOP=1 -f db/tests/002_v3_rls_regression.sql
