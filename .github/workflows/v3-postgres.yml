
name: Bus V3 - PostgreSQL Tests

on:
  push:
    branches:
      - feature/bus-v3-foundations
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: bus_v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bus_v3_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only-password
      PGDATABASE: bus_v3_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run V3 base migration
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/001_v3_core.sql

      - name: Run V3 integrity migration
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/002_v3_integrity.sql

      - name: Run database security tests
        run: |
          psql -v ON_ERROR_STOP=1 -f db/tests/001_v3_integrity_regression.sql
