name: Bus V3 - SYNC-07 Android SQLCipher Native Library
on:
  push:
    branches:
      - feature/bus-v3-sync07-android-storage
  pull_request:
    branches:
      - feature/bus-v3-sync06-durable-mobile-gate
permissions:
  contents: read
jobs:
  android-compile-and-bridge-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform API 35 with preinstalled SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMGR"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Compile standalone Android encrypted storage library (no APK)
        run: gradle --no-daemon -p android-sync07 :storage:assembleDebug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS bridge and SYNC-06 regression tests
        run: |
          node --check mobile-sync07/bridge.mjs
          node --test mobile-sync07/tests/sync07-bridge.test.mjs
          node --test mobile-sync06/tests/sync06-durable.test.mjs mobile-sync05/tests/sync05-contract.test.mjs
