name: Bus V3 - SYNC-08 Android Emulator Storage Tests
on:
  push:
    branches:
      - feature/bus-v3-sync08-capacitor-test-plugin
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypted-store-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable virtual-machine acceleration for ephemeral CI
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Real Android emulator instrumentation of SQLCipher and Keystore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: gradle --no-daemon -p android-sync07 :storage:connectedDebugAndroidTest
      - name: Upload instrumented test results (including on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync08-android-instrumented-results
          path: android-sync07/storage/build/outputs/androidTest-results/
          if-no-files-found: ignore
