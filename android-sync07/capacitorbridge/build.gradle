plugins { id 'com.android.library' }

android {
    namespace 'org.eneo360.a2sscola.sync08'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
dependencies {
    implementation project(':storage')
    // Capacitor classpath for compile-time verification only.
    // Host project provides its OWN matched @capacitor/android runtime.
    compileOnly 'com.capacitorjs:core:8.5.3'
    // getActivity()/BridgeActivity type extends AppCompatActivity.
    compileOnly 'androidx.appcompat:appcompat:1.7.1'
}
