plugins { id 'com.android.application' }

android {
    namespace 'cd.eneo360.busscolaire.v3.sync09test'
    compileSdk 36
    defaultConfig {
        // DIFFERENT from the installed cd.eneo360.busscolaire.v3 UI-145.
        applicationId 'cd.eneo360.busscolaire.v3.sync09.test'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.0.1-debug-only'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            // Defense in depth: no opt-in in any release variant.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
dependencies {
    implementation project(':storage')
    implementation project(':capacitorbridge')
    implementation 'com.capacitorjs:core:8.5.3'
    // BridgeActivity extends AppCompatActivity; Maven core POM marks this runtime.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
